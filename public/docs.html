<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docs | Elaina API</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #fff; overflow-x: hidden; }
        .bg-grid { position: fixed; inset: 0; z-index: -1; background-image: linear-gradient(#00000018 1px, transparent 1px), linear-gradient(90deg, #00000018 1px, transparent 1px); background-size: 35px 35px; mask-image: radial-gradient(circle at center, black 60%, transparent 95%); }
        .sidebar { position: fixed; left: 0; top: 0; height: 100vh; width: 250px; background: #fff; border-right: 2px solid #000; z-index: 100; transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); transform: translateX(-100%); }
        .sidebar.active { transform: translateX(0); }
        .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.15); z-index: 90; display: none; }
        .sidebar-overlay.active { display: block; }
        .main-content { padding: 40px; padding-top: 110px; max-width: 800px; margin: 0 auto; }
        .top-header { position: fixed; top: 0; left: 0; width: 100%; height: 75px; background: #fff; border-bottom: 2px solid #000; z-index: 40; display: flex; align-items: center; justify-content: center; }
        .toggle-btn { position: fixed; left: 20px; top: 20px; z-index: 50; background: #fff; border: 2px solid #000; padding: 10px; cursor: pointer; transition: 0.2s; }
        .toggle-btn:active { scale: 0.9; }
        .box-container { position: relative; border: 1.5px solid #000; background: #fafafa; overflow: hidden; }
        .scroll-wrapper { padding: 12px; padding-right: 45px; overflow-x: auto; font-family: monospace; font-size: 11px; white-space: nowrap; }
        .copy-fixed-single, .btn-tool-res { background: #fff; border: 1.5px solid #000; padding: 5px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .copy-fixed-single { position: absolute; top: 8px; right: 8px; z-index: 20; }
        .copy-fixed-single:hover, .btn-tool-res:hover { background: #000; color: #fff; }
        .endpoint-card { border: 2px solid #000; background: #fff; margin-bottom: 20px; transition: box-shadow 0.2s; }
        .endpoint-card:hover { box-shadow: 4px 4px 0px #000; }
        .endpoint-header { padding: 12px 20px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .nav-link { display: flex; align-items: center; gap: 10px; padding: 12px 25px; font-weight: 700; font-size: 11px; text-transform: uppercase; cursor: pointer; border-bottom: 1px solid #f5f5f5; }
        .nav-link.active { background: #000; color: #fff; }
        .dash-card { border: 2px solid #000; background: #fff; padding: 25px; }
        .badge-mini { font-size: 8px; font-weight: 900; padding: 1px 5px; border: 1px solid #000; }
        .legend { font-size: 8px; font-weight: 900; padding: 3px 8px; border: 1.5px solid #000; text-transform: uppercase; }
        .shimmer { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; position: absolute; inset: 0; }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        /* Styling Dropdown agar tidak default buruk di mobile */
        select.p-input {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: none;
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div id="overlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <header class="top-header"><div class="flex flex-col items-center"><h1 class="font-black text-lg tracking-widest uppercase">Elaina's Library</h1><p class="text-[9px] font-bold text-gray-400 uppercase tracking-[0.3em] mt-0.5">Majo no Tabitabi API v1.0</p></div></header>
    <button id="toggle" class="toggle-btn" onclick="toggleSidebar()"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <aside id="sidebar" class="sidebar">
        <div class="p-8 border-b-2 border-black flex justify-between items-center bg-gray-50"><h1 class="font-black text-xs tracking-widest uppercase">Menu</h1><button onclick="toggleSidebar()" class="p-1.5 border border-black"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-width="2.5"/></svg></button></div>
        <nav class="mt-4"><div class="nav-link active" id="btn-dash"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" stroke-width="2"/></svg><span>Dashboard</span></div><p class="px-8 mt-6 text-[9px] font-black text-gray-300 uppercase tracking-widest mb-2">Categories</p><div id="cat-list"></div></nav>
        <div class="absolute bottom-0 w-full p-6 border-t border-black bg-white"><a href="/" class="text-[10px] font-bold underline italic opacity-40 uppercase tracking-widest">← Exit Docs</a></div>
    </aside>
    <main class="main-content">
        <div id="view-dash"><div class="mb-10 text-center md:text-left"><h2 class="text-4xl font-extrabold uppercase tracking-tighter italic">Infrastructure</h2><p class="text-gray-400 text-sm font-bold mt-1">Real-time status of the Wandering Witch API library.</p></div><div id="dash-content" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div></div>
        <div id="view-cat" class="hidden"><div class="flex flex-wrap gap-2 mb-8 border-b border-black pb-8"><span class="legend bg-green-500 text-white border-black">200 SUCCESS</span><span class="legend bg-red-500 text-white border-black">400 CLIENT ERR</span><span class="legend bg-yellow-400 border-black">500 SERVER ERR</span><span class="legend bg-blue-500 text-white border-black">GET</span></div><h2 id="cat-title" class="text-4xl font-extrabold uppercase tracking-tighter italic">Category</h2><p id="cat-label" class="text-[10px] font-black uppercase opacity-40 tracking-widest mt-1.5 mb-10"></p><div id="end-list"></div></div>
    </main>
    <script src="/js/docs-logic.js"></script>
</body>
</html>
